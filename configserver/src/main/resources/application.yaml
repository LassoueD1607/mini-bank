# ============================================================
# SERVER
# ============================================================
server:
  port: 8071

# ============================================================
# SPRING
# ============================================================
spring:
  application:
    name: configserver
  profiles:
    active: git

  # --- Config Server (git-backed) ---
  cloud:
    config:
      server:
#        native:
#          search-locations: "classpath:/config" #Where are our properties are stored
#          search-locations: "file:///C://workspace//configserver-configs"
        git:
          uri: "https://github.com/LassoueD1607/mini-bank-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true #clone the github repo into local system during the startup. (if this is not mentioned, the clone will happen at then the first call of github repo
          force-pull: true #Tell to override all local changes whenever you try to start or restart your config server. Make sure we are always reading from github repo and not to apply the changes in the local
          username: LassoueD1607
          password: ${CONFIG_GIT_TOKEN}
        monitor:
          github:
            webhookSecret: ${GITHUB_WEBHOOK_SECRET}

  # --- Messaging (RabbitMQ / Spring Cloud Bus) ---
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

# ============================================================
# ENCRYPTION
# ============================================================
encrypt:
  key: ${ENCRYPT_KEY}

# ============================================================
# MANAGEMENT / ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: "*" #Needed for the busrefresh
  #These are used to expose liveness and readiness used for dependance between config server and other microserver when starting with docker-compose. To let other MS wait for config server
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
